<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZONEFALL</title>
  <meta name="description" content="ZONEFALL: a realistic battle royale in the browser. Drop onto Kessler Isle, loot, and be the last one standing against other players and bots.">
  <meta name="theme-color" content="#0d0f0e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230d0f0e'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23e8b23a' stroke-width='5'/%3E%3Cpath d='M22 23h20L22 41h20' fill='none' stroke='%23e9e7e1' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/ui/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.16/build/index.module.js",
      "trystero": "https://cdn.jsdelivr.net/npm/@trystero-p2p/nostr@0.25.4/+esm",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.5/build/index.js",
      "ez-tree": "https://cdn.jsdelivr.net/npm/@dgreenheck/ez-tree@1.1.0/build/ez-tree.es.js"
    }
  }
  </script>
  <style>
    /* Boot-critical styles only; everything else lives in src/ui/styles.css (UI group). */
    html, body { margin: 0; height: 100%; background: #0d0f0e; color: #e9e7e1; overflow: hidden; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #boot, #fatal { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0f0e;
      font: 500 13px/1.5 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .08em; z-index: 50; }
    #boot b { display: block; font: 700 clamp(44px, 9vw, 120px)/0.9 'Barlow Condensed', system-ui, sans-serif;
      letter-spacing: .04em; color: #e9e7e1; margin-bottom: 14px; }
    #boot span { color: #8f948f; text-transform: uppercase; }
    #fatal[hidden] { display: none; }
    #fatal .box { max-width: min(640px, calc(100vw - 32px)); padding: 28px; border: 1px solid rgba(233,231,225,.16);
      background: #121413; }
    #fatal h1 { margin: 0 0 6px; font: 700 34px/1 'Barlow Condensed', system-ui, sans-serif; letter-spacing: .04em; color: #e5484d; }
    #fatal [data-where] { color: #e8b23a; text-transform: uppercase; }
    #fatal pre { white-space: pre-wrap; word-break: break-word; color: #c9ccc7; margin: 14px 0 20px; max-height: 40vh; overflow: auto; }
    #fatal button { font: 600 15px/1 'Barlow Condensed', system-ui, sans-serif; letter-spacing: .12em; padding: 12px 22px;
      background: #e9e7e1; color: #0d0f0e; border: 0; cursor: pointer; }
    #fatal button:focus-visible { outline: 2px solid #e8b23a; outline-offset: 3px; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="ZONEFALL game view"></canvas>
  <div id="ui"></div>

  <div id="boot" role="status" aria-live="polite">
    <div><b>ZONEFALL</b><span>Starting</span></div>
  </div>

  <div id="fatal" role="alert" hidden>
    <div class="box">
      <h1>ZONEFALL STOPPED</h1>
      <div data-where></div>
      <pre data-detail></pre>
      <button type="button" onclick="location.reload()">RELOAD</button>
    </div>
  </div>

  <noscript>
    <div id="fatal" style="display:grid"><div class="box"><h1>JAVASCRIPT REQUIRED</h1><pre>ZONEFALL runs entirely in your browser and needs JavaScript and WebGL 2.</pre></div></div>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
